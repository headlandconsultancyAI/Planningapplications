
name: Discover Idox documents

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m playwright install --with-deps chromium

      - name: Test council website connectivity
        shell: bash
        run: |
          echo "Testing DNS resolution..."
          getent ahosts planninganddevelopment.nelincs.gov.uk || true

          echo "Testing HTTPS connection..."
          curl -4 -v -L \
            --connect-timeout 10 \
            --max-time 30 \
            -o /dev/null \
            -w '\nHTTP status: %{http_code}\nTotal time: %{time_total}s\n' \
            'https://planninganddevelopment.nelincs.gov.uk/online-applications/applicationDetails.do?activeTab=documents&keyVal=TJPJA1LJI5600' \
            2>&1 | tail -60

      - name: Discover planning documents
        run: python download.py --output output

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-inventory-and-diagnostics
          path: output/
          retention-days: 7
          if-no-files-found: warn
