name: Discover Idox documents
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python download.py --output output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planning-inventory-and-diagnostics
          path: output/
          retention-days: 7
          if-no-files-found: warn
